# ============================================================
# TuniLink — Shared configuration (all profiles)
# ============================================================
# Active profile: set to "dev" (MailHog) or "prod" (Gmail SMTP)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.application.name=backend
server.port=8081

# --- Datasource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:stage_db}
spring.datasource.username=${POSTGRES_USER:stage_user}
spring.datasource.password=${POSTGRES_PASSWORD:mayssa@project}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Frontend ---
app.frontend-url=http://localhost:5173

# --- Google OAuth ---
google.client-id=423143793489-i96itnuqbc1lrl3r4fhjiqpmvm25qker.apps.googleusercontent.com

# --- Multipart / Upload ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
