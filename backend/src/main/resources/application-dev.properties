# ============================================================
# TuniLink — DEV profile (MailHog fake SMTP)
# ============================================================
# MailHog catches all outgoing email and displays it in a web UI.
# Web UI:  http://localhost:8025
# SMTP:    localhost:1025  (no auth, no TLS)
# ============================================================

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=tunilink-dev@localhost
spring.mail.password=

# MailHog does not require auth or TLS
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
