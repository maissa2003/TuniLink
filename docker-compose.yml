services:
  postgres:
    image: postgres:16
    container_name: stage_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stage_db}
      POSTGRES_USER: ${POSTGRES_USER:-stage_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mayssa@project}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stage_backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-stage_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-stage_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mayssa@project}
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stage_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

  # ── Fake SMTP server for local development ──
  mailhog:
    image: mailhog/mailhog:latest
    container_name: stage_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI — open http://localhost:8025
    environment:
      MH_STORAGE: memory

volumes:
  postgres_data:
